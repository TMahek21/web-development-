<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - CHARUSAT Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="login-page register-page">

    <main class="loginbox registerbox">
        <h1>CHARUSAT STUDENT PORTAL</h1>
        <h2>Student Registration</h2>
        <img src="charusat.jpg" class="background" alt="CHARUSAT Campus">

        <!-- SUCCESS MESSAGE CONTAINER -->
        <div id="regSuccessMsg" class="success-message" style="display: none;">
            Registration successful! Your account has been created.
            <br>
            <a href="loginpage.html" class="login-link">Click here to Login</a>
        </div>

        <form id="registrationForm" action="register.php" method="POST" novalidate>

            <!-- 1. FULL NAME -->
            <div class="form-group">
                <label for="regName" class="form-label">Full Name:</label>
                <input type="text" id="regName" name="name" placeholder="Enter Full Name" required>
                <small class="error-msg" id="nameError"></small>
            </div>

            <!-- 2. EMAIL ADDRESS -->
            <div class="form-group">
                <label for="regEmail" class="form-label">Email Address:</label>
                <input type="email" id="regEmail" name="email" placeholder="Enter Email Address" required>
                <small class="error-msg" id="emailError"></small>
            </div>

            <!-- 3. MOBILE NUMBER -->
            <div class="form-group">
                <label for="regMobile" class="form-label">Mobile Number:</label>
                <input type="tel" id="regMobile" name="mobile" placeholder="10-digit Mobile Number" maxlength="10" required>
                <small class="error-msg" id="mobileError"></small>
            </div>

            <!-- 4. PASSWORD -->
            <div class="form-group">
                <label for="regPassword" class="form-label">Password:</label>
                <input type="password" id="regPassword" name="password" placeholder="Enter Password" required>
                <div id="strengthMeter" class="strength-meter">Strength: <span id="strengthText">-</span></div>
                <small class="error-msg" id="passwordError"></small>
            </div>

            <!-- 5. CONFIRM PASSWORD -->
            <div class="form-group">
                <label for="regConfirmPassword" class="form-label">Confirm Password:</label>
                <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                <small class="error-msg" id="confirmPasswordError"></small>
            </div>

            <!-- 6. COURSE -->
            <div class="form-group">
                <label for="regCourse" class="form-label">Course:</label>
                <select id="regCourse" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="B.Tech Computer Engineering">B.Tech Computer Engineering</option>
                    <option value="B.Tech Information Technology">B.Tech Information Technology</option>
                    <option value="B.Tech Computer Science">B.Tech Computer Science</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                </select>
                <small class="error-msg" id="courseError"></small>
            </div>

            <!-- 7. YEAR -->
            <div class="form-group">
                <label for="regYear" class="form-label">Year of Study:</label>
                <select id="regYear" name="year" required>
                    <option value="">-- Select Year --</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
                <small class="error-msg" id="yearError"></small>
            </div>

            <!-- 8. GENDER -->
            <div class="form-group">
                <label class="form-label">Gender:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male" id="genderMale"> Male</label>
                    <label><input type="radio" name="gender" value="Female" id="genderFemale"> Female</label>
                    <label><input type="radio" name="gender" value="Other" id="genderOther"> Other</label>
                </div>
                <small class="error-msg" id="genderError"></small>
            </div>

            <!-- 9. TERMS AND CONDITIONS -->
            <div class="form-group checkbox-group">
                <label for="regTerms">
                    <input type="checkbox" id="regTerms" name="terms"> I accept the <a href="#" onclick="alert('Terms & Conditions: Follow all university regulations.'); return false;">Terms and Conditions</a>
                </label>
                <small class="error-msg" id="termsError"></small>
            </div>

            <!-- FORM ACTIONS -->
            <div class="form-actions">
                <input type="submit" id="regSubmitBtn" value="Register">
                <input type="reset" id="regResetBtn" value="Clear">
            </div>

            <p style="margin-top: 15px; text-align: center;">Already have an account? <a href="loginpage.html">Login Here</a></p>

        </form>

    </main>

    <!-- Dark/Light Theme Emoji Button in Bottom-Right Corner -->
    <span id="theme-toggle" class="theme-btn login-theme-btn" title="Toggle Theme">🌙</span>

</body>

</html>
